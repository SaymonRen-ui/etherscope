name: Build EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Потолок pywinrt — Python 3.12 (даже 6.x требует <3.13)
          python-version: "3.12"

      - name: Install deps + PyInstaller
        run: pip install -r requirements.txt pyinstaller

      - name: Build onefile EXE from spec
        run: pyinstaller EtherScope.spec

      - name: Attach EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EtherScope.exe
